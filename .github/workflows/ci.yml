name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CPU only. No weights are downloaded: the model tests and the real-queue check build a tiny random DuoMatching generator in the official
# file layout and replace the text encoder and the VAE by small stand-ins. The trained model is checked outside CI; see
# docs/VERIFICATION.md.
env:
  UPSTREAM_COMMIT: 1f1d81f1f786ec121e41d852dfad8bea4eb3e252

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        comfyui: ["v0.38.0"]  # the ComfyUI release the pack was verified with
        os: [ubuntu-24.04, windows-latest]
        python: ["3.12"]
        torch: ["2.14.1"]
        torchvision: ["0.29.1"]
        pins: [""]
        include:
          # the lowest versions this pack allows: upstream's pins of diffusers / transformers / tokenizers
          - os: ubuntu-24.04
            comfyui: "v0.38.0"
            python: "3.10"
            torch: "2.8.0"
            torchvision: "0.23.0"
            pins: "diffusers==0.38.0 transformers==4.57.1 tokenizers==0.22.2"
          # the current ComfyUI release as well
          - os: ubuntu-24.04
            python: "3.12"
            torch: "2.14.1"
            torchvision: "0.29.1"
            pins: ""
            comfyui: "v0.41.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ComfyUI-DuoMatching
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Reference checkouts (pinned)
        run: |
          git -c core.autocrlf=false clone --quiet --depth 1 --branch "${{ matrix.comfyui }}" https://github.com/Comfy-Org/ComfyUI.git refs/ComfyUI
          $pinned = @{ 'v0.38.0' = '6b747c0428c343e1417219641db93a4fb7cb69ae'; 'v0.41.0' = '98cc0bf84b7cb1383654c5b402e7612d875d6d22' }["${{ matrix.comfyui }}"]
          if (-not $pinned -or (git -C refs/ComfyUI rev-parse HEAD) -ne $pinned) { throw "ComfyUI commit mismatch" }
          git -c core.autocrlf=false clone --quiet --filter=blob:none --no-checkout https://github.com/JohnZhan2023/DuoMatching.git refs/DuoMatching
          git -C refs/DuoMatching -c core.autocrlf=false checkout --quiet $env:UPSTREAM_COMMIT

      - name: Install (CPU)
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true   # a failing pip must fail the step
          python -m pip install --upgrade pip
          # CPU torch first: on Linux ComfyUI's unpinned `torch` requirement would otherwise pull the CUDA build and its libraries
          pip install torch==${{ matrix.torch }} torchvision==${{ matrix.torchvision }} --index-url https://download.pytorch.org/whl/cpu
          pip install -r refs/ComfyUI/requirements.txt -r ComfyUI-DuoMatching/requirements.txt pytest ruff
          if ("${{ matrix.pins }}") { pip install ("${{ matrix.pins }}" -split ' ') }
          pip list

      - name: Lint
        run: ruff check --no-cache ComfyUI-DuoMatching

      - name: No absolute local paths in the repository
        run: |
          $files = git -C ComfyUI-DuoMatching ls-files | Where-Object { $_ -notmatch '\.(png|jpg|webp|gif)$' } | ForEach-Object { Join-Path ComfyUI-DuoMatching $_ }
          $hits = $files | Select-String -Pattern '[A-Za-z]:\\{1,2}[A-Za-z0-9_.-]+\\|/home/[a-z]+/|/Users/[A-Za-z]+/'
          if ($hits) { $hits | ForEach-Object { "$($_.Path):$($_.LineNumber)" }; throw "absolute local path found" }

      - name: Tests (references required, nothing may be skipped)
        env:
          DUOMATCHING_COMFYUI_DIR: ${{ github.workspace }}/refs/ComfyUI
          DUOMATCHING_UPSTREAM_DIR: ${{ github.workspace }}/refs/DuoMatching
          DUOMATCHING_REQUIRE_REFERENCES: "1"
        run: |
          Set-Location ComfyUI-DuoMatching
          python -m pytest tests -q -rs -p no:cacheprovider -W ignore::DeprecationWarning -W ignore::FutureWarning

      - name: Real ComfyUI queue on CPU (tiny random model)
        run: |
          python ComfyUI-DuoMatching/scripts/ci_queue_check.py --comfyui refs/ComfyUI --workdir queue-logs

      - name: ComfyUI log on failure
        if: failure()
        run: |
          if (Test-Path queue-logs/comfyui.log) { Get-Content queue-logs/comfyui.log -Tail 120 }
